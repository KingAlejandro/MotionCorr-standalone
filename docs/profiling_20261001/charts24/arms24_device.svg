<text x="228.0" y="330.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold">cand --ingest nvcomp</text>
<text x="228.0" y="345.0" font-size="10" fill="#898781" text-anchor="end" font-weight="normal">span 16.671 s</text>
<rect x="240" y="312" width="311.1" height="40" rx="3" fill="#e6e5e0" stroke="#c3c2b7" stroke-width="0.6"/>
