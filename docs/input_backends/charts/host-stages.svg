<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="675" viewBox="0 0 1180 675"><title>Where the input path spends host time, per run</title><rect width="1180" height="100%" fill="#ffffff"/><text x="16.0" y="32.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="17" fill="#15202b" text-anchor="start" font-weight="bold">Where the input path spends host time, per run</text><text x="16.0" y="54.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">4GPUs A100-80GB PCIe, CUDA 12.8, nvCOMP 5.3.0.16, Release | taskset 96-103, --j 8, one flock acquisition</text><text x="16.0" y="69.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">separate TIMING=ON builds of both arms; median of 3 repetitions; whole-run stage totals, not per movie</text><text x="16.0" y="84.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">these walls are NOT comparable with the production figures elsewhere -- an instrumented build is a different binary</text><line x1="430.0" y1="123" x2="430.0" y2="549" stroke="#c9d2da" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.6"/><text x="430.0" y="117.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="middle" font-weight="normal">0.00</text><line x1="530.0" y1="123" x2="530.0" y2="549" stroke="#c9d2da" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.6"/><text x="530.0" y="117.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="middle" font-weight="normal">0.60</text><line x1="630.0" y1="123" x2="630.0" y2="549" stroke="#c9d2da" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.6"/><text x="630.0" y="117.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="middle" font-weight="normal">1.20</text>