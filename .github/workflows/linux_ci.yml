name: Linux CI & Smoke Checks

on:
  push:
    branches:
      - main
      - dev_milan
      - 'feat/**'
  pull_request:
    branches:
      - main
      - dev_milan

jobs:
  build-and-test:
    name: Linux CI (${{ matrix.os }} - ${{ matrix.compiler.name }} - ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        compiler:
          - name: GCC
            c: gcc
            cxx: g++
          - name: Clang
            c: clang
            cxx: clang++
        build_type: [Release, Debug]
        include:
          - os: ubuntu-24.04
            compiler:
              name: GCC
              c: gcc
              cxx: g++
            build_type: Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libfftw3-dev \
            libtiff-dev \
            libpng-dev \
            libjpeg-dev \
            zlib1g-dev \
            libomp-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Pre-Flight Toolchain & Dependency Audit
        run: |
          echo "=== System Information ==="
          uname -a
          echo "=== CMake Version ==="
          cmake --version
          echo "=== Compiler Version ==="
          ${{ matrix.compiler.cxx }} --version
          echo "=== Pkg-Config Library Versions ==="
          pkg-config --modversion fftw3f || echo "fftw3f not registered in pkg-config"
          pkg-config --modversion libtiff-4 || echo "libtiff-4 not registered in pkg-config"

      - name: CMake Out-of-Source Configuration
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.c }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}

      - name: Compile Standalone MotionCorr
        run: |
          cmake --build build -j$(nproc)

      - name: CLI Smoke Check & Help Validation
        run: |
          echo "=== Verifying CLI Binary Execution ==="
          test -x build/motioncorr
          ./build/motioncorr --help 2>&1 | grep -i "RELION's own implementation" || true

      - name: Execute Reference Numerical Acceptance Gates
        run: |
          python tests/test_reference_gates.py

      - name: Execute Testing Agent Orchestrator
        run: |
          python agents/testing_agent/scripts/run_build_and_test.py --build-type ${{ matrix.build_type }}
