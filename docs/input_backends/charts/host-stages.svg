erif" font-size="11" fill="#3c4a57" text-anchor="end" font-weight="normal">branch — nvcomp</text><rect x="430.0" y="396" width="117.4" height="18" rx="3" fill="#8854d0"/><text x="488.7" y="409.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">0.72</text><text x="559.4" y="409.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="start" font-weight="bold">0.72 s</text><text x="418.0" y="439.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="end" font-weight="normal">main — compact</text><rect x="430.0" y="426" width="429.7" height="18" rx="3" fill="#eb3b5a"/><text x="644.9" y="439.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">2.59</text><rect x="861.7" y="426" width="120.1" height="18" rx="3" fill="#20bf6b"/><text x="921.8" y="439.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">0.73</text><text x="993.8" y="439.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="start" font-weight="bold">3.32 s</text><text x="418.0" y="469.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="end" font-weight="normal">branch — compact</text><rect x="430.0" y="456" width="427.1" height="18" rx="3" fill="#eb3b5a"/><text x="643.5" y="469.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">2.57</text><rect x="859.1" y="456" width="0.8" height="18" rx="3" fill="#8854d0"/><rect x="859.2" y="456" width="124.2" height="18" rx="3" fill="#20bf6b"/><text x="921.4" y="469.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">0.76</text><text x="995.5" y="469.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="start" font-weight="bold">3.33 s</text><text x="418.0" y="499.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="end" font-weight="normal">main — nvcomp  (ingest untagged in main)</text><text x="440.0" y="499.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="start" font-weight="bold">0.00 s</text><text x="418.0" y="529.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="end" font-weight="normal">branch — nvcomp</text><rect x="430.0" y="516" width="126.6" height="18" rx="3" fill="#8854d0"/><text x="493.3" y="529.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">0.77</text><text x="568.6" y="529.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="start" font-weight="bold">0.77 s</text><line x1="16" y1="589" x2="1164" y2="589" stroke="#c9d2da"/><text x="16.0" y="609.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">&quot;host decode&quot; is the LibTIFF decode, and on the float route the float materialisation with it. &quot;device ingest&quot; is the whole GPU</text><text x="16.0" y="625.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">ingest including its own file reads, which is why the nvCOMP arms show no host decode and no separate gain stage.</text><text x="16.0" y="641.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">main predates the device-ingest timer, so where main itself takes nvCOMP that stage is untagged and reads as zero; that row is marked, not compared.</text><text x="16.0" y="657.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">Single time domain: every segment is a host-side stage timer from the same instrumented run.</text></svg>