<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="476" viewBox="0 0 1180 476"><title>gpu occupancy</title><rect width="1180" height="476" fill="#ffffff"/><text x="16.0" y="32.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="17" fill="#15202b" text-anchor="start" font-weight="bold">GPU occupancy within the profiled trace</text><text x="16.0" y="54.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">source perf/single-gpu-pools a118699 (production tree identical to validated 054ed6d) vs base 5d0eb5c</text><text x="16.0" y="69.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">4GPUs A100-80GB GPU-eddb42fe, CUDA 12.8, nvCOMP 5.3.0.16, Release</text><text x="16.0" y="84.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">taskset 64-71, OMP_NUM_THREADS=6, THP madvise</text><text x="16.0" y="99.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">capture: nsys --trace=cuda,nvtx</text><text x="16.0" y="114.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">Interval union of kernel and copy activity over the SAME capture that defines the span, so idle is measured inside</text><text x="16.0" y="129.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">this trace and is not derived by subtracting from an unprofiled wall.</text><text x="16.0" y="144.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">Profiled spans are inflated by CUPTI and are NOT production walls. Only the comparison between the two arms is</text><text x="16.0" y="159.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">meaningful here.</text><rect x="230" y="192" width="12" height="12" fill="#8854d0"/><text x="248.0" y="202.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">kernel</text><rect x="480" y="192" width="12" height="12" fill="#f7b731"/><text x="498.0" y="202.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">copy (non-overlapping remainder)</text><rect x="730" y="192" width="12" height="12" fill="#dfe4ea"/><text x="748.0" y="202.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">idle, measured in-trace</text><text x="218.0" y="240.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="end" font-weight="bold">a1_base</text><text x="218.0" y="255.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#72808d" text-anchor="end" font-weight="normal">span 15.43 s</text><rect x="230" y="220" width="735.8" height="46" rx="3" fill="#dfe4ea" stroke="#c9d2da" stroke-width="0.6"/><rect x="230" y="220" width="201.9" height="46" rx="3" fill="#f7b731"/><rect x="230" y="220" width="145.9" height="46" rx="3" fill="#8854d0"/><text x="237.0" y="248.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#fff" text-anchor="start" font-weight="bold">3.06</text><text x="747.8" y="240.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="start" font-weight="bold">27.4% busy (union)</text><text x="747.8" y="255.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#72808d" text-anchor="start" font-weight="normal">24990 launches, 4.62 GB H2D</text><text x="218.0" y="312.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="end" font-weight="bold">a6_final</text><text x="218.0" y="327.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#72808d" text-anchor="end" font-weight="normal">span 11.35 s</text><rect x="230" y="292" width="541.3" height="46" rx="3" fill="#dfe4ea" stroke="#c9d2da" stroke-width="0.6"/><rect x="230" y="292" width="172.9" height="46" rx="3" fill="#f7b731"/><rect x="230" y="292" width="146.0" height="46" rx="3" fill="#8854d0"/><text x="237.0" y="320.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#fff" text-anchor="start" font-weight="bold">3.06</text><text x="553.3" y="312.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="start" font-weight="bold">31.9% busy (union)</text><text x="553.3" y="327.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#72808d" text-anchor="start" font-weight="normal">24875 launches, 3.31 GB H2D</text><line x1="16" y1="406" x2="1164" y2="406" stroke="#c9d2da"/><text x="16.0" y="426.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">Busy is a union over kernel AND copy intervals together, so concurrent work is not double-counted; the orange band is the part of busy that is copy-only.</text><text x="16.0" y="444.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">Kernel union is unchanged between the arms (3.06 s both). The span difference is host-side and transfer-side, not kernel work.</text></svg>