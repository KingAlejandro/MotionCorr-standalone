" fill="#ffffff" text-anchor="middle" font-weight="bold">2.57</text><rect x="859.1" y="471" width="0.8" height="18" rx="3" fill="#8854d0"/><rect x="859.2" y="471" width="124.2" height="18" rx="3" fill="#20bf6b"/><text x="921.4" y="484.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">0.76</text><text x="995.5" y="484.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="start" font-weight="bold">3.33 s</text><text x="418.0" y="514.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="end" font-weight="normal">historical base — nvcomp (untagged)</text><text x="440.0" y="514.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="start" font-weight="bold">unavailable</text><text x="418.0" y="544.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="end" font-weight="normal">historical candidate — nvcomp</text><rect x="430.0" y="531" width="126.6" height="18" rx="3" fill="#8854d0"/><text x="493.3" y="544.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">0.77</text><text x="568.6" y="544.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12.5" fill="#15202b" text-anchor="start" font-weight="bold">0.77 s</text><line x1="16" y1="604" x2="1164" y2="604" stroke="#c9d2da"/><text x="16.0" y="624.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">&quot;host decode&quot; is the LibTIFF decode, and on the float route the float materialisation with it. &quot;device ingest&quot; is the whole GPU</text><text x="16.0" y="640.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">ingest including its own file reads, which is why the nvCOMP arms show no host decode and no separate gain stage.</text><text x="16.0" y="656.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">Baseline nvCOMP ingestion was untagged: unavailable is not zero, and the baseline total is not compared.</text><text x="16.0" y="672.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">TIMING-arm source commits and binary SHA256 pins: UNRECORDED in this retained payload; production-run hashes are not substituted.</text><text x="16.0" y="688.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">Original data/plots are preserved; their raw-run success and completeness have not been revalidated here.</text><text x="16.0" y="704.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">New parser output requires successful complete runs; absent optional timers are explicit null, not zero.</text><text x="16.0" y="720.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">Every segment is a host elapsed stage timer, not CPU utilization or pure GPU duration. Totals sum per-stage medians.</text></svg>