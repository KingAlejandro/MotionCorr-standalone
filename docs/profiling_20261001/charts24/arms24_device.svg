<rect x="300.0" y="312" width="21.8" height="40" rx="3" fill="#eb6834"/>
<text x="247.0" y="337.0" font-size="11" fill="#fff" text-anchor="start" font-weight="bold">3.21</text>
<text x="563.1" y="330.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">device busy &lt;= 26.3% of span</text>
<text x="563.1" y="345.0" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">25542 launches, 4.6 GB H2D</text>
<line x1="26" y1="404" x2="1294" y2="404" stroke="#c3c2b7"/>
<text x="26.0" y="426.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Kernel and memcpy are unioned separately and may overlap each other, so busy time is AT MOST their sum and the remainder is a LOWER bound on idle.</text>
<text x="26.0" y="444.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">The remainder is therefore shown only as remainder of span. Quantifying device inactivity needs a union over kernel and memcpy together within one trace.</text>
<text x="26.0" y="462.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">An arm with no capture is hatched. Absence of a trace is not absence of GPU work.</text>

</svg>