e slow movie each (1.80 s and 1.87 s) that stretches the min-max bar; the medians are unaffected and both are retained.</text><text x="16.0" y="708.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">Single time domain: all observations are unprofiled production runs.</text></svg>