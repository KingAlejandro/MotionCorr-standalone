<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Same-correlation-map scalar curvature error" viewBox="0 0 1020 585" width="1020" height="585"><title>Same-correlation-map scalar curvature error</title><desc>Existing float expression has worst-case 0.13525164 pixel disagreement with promoted evaluation, while stable float denominator has 0.000002646 pixels. This is a host replay, not a modified kernel run.</desc><rect width="1020" height="585" fill="#ffffff"/><text x="45" y="56" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#142336" font-weight="700">Subpixel curvature: avoidable scalar error</text><text x="45" y="87" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#506276" >Largest candidate-component difference vs double evaluation of the SAME captured samples</text><line x1="160" y1="463" x2="945" y2="463" stroke="#e3ebef" stroke-width="1"/><text x="140" y="468" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#576c7c" text-anchor="end">10^-7</text><line x1="160" y1="417.57142857142856" x2="945" y2="417.57142857142856" stroke="#e3ebef" stroke-width="1"/><text x="140" y="422.57142857142856" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#576c7c" text-anchor="end">10^-6</text><line x1="160" y1="372.14285714285717" x2="945" y2="372.14285714285717" stroke="#e3ebef" stroke-width="1"/><text x="140" y="377.14285714285717" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#576c7c" text-anchor="end">10^-5</text><line x1="160" y1="326.7142857142857" x2="945" y2="326.7142857142857" stroke="#e3ebef" stroke-width="1"/><text x="140" y="331.7142857142857" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#576c7c" text-anchor="end">10^-4</text><line x1="160" y1="281.28571428571433" x2="945" y2="281.28571428571433" stroke="#e3ebef" stroke-width="1"/><text x="140" y="286.28571428571433" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#576c7c" text-anchor="end">10^-3</text><line x1="160" y1="235.85714285714286" x2="945" y2="235.85714285714286" stroke="#e3ebef" stroke-width="1"/><text x="140" y="240.85714285714286" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#576c7c" text-anchor="end">10^-2</text><line x1="160" y1="190.42857142857144" x2="945" y2="190.42857142857144" stroke="#e3ebef" stroke-width="1"/><text x="140" y="195.42857142857144" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#576c7c" text-anchor="end">10^-1</text><line x1="160" y1="145" x2="945" y2="145" stroke="#e3ebef" stroke-width="1"/><text x="140" y="150" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#576c7c" text-anchor="end">1</text><rect x="280" y="184.47095318883964" width="185" height="278.52904681116036" rx="5" fill="#b87859"/><text x="372.5" y="170.47095318883964" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#26384c" text-anchor="middle" font-weight="700">0.13525164 px</text><text x="372.5" y="494" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#293d52" text-anchor="middle">Existing float32 expression</text><rect x="650" y="398.373775846747" width="185" height="64.62622415325302" rx="5" fill="#2b878d"/><text x="742.5" y="384.373775846747" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#26384c" text-anchor="middle" font-weight="700">2.646000e-6 px</text><text x="742.5" y="494" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#293d52" text-anchor="middle">Stable float32 denominator</text><text x="560" y="549" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#53697b" text-anchor="middle">≈51,000× smaller in host replay; NOT a measured improvement to a patched native kernel</text><text x="45" y="578" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#65798a" >Source: PR #250 scalar replay of 32,195 recorded CUDA candidates (64,390 axes).</text></svg>