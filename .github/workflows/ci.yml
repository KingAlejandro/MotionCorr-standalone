name: Linux CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Smoke Check (Ubuntu Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            pkg-config \
            libfftw3-dev \
            libtiff-dev \
            libpng-dev \
            libjpeg-dev \
            zlib1g-dev \
            ghostscript \
            xz-utils

      - name: Install required numerical validation dependencies
        run: python3 -m pip install 'numpy>=2.4.0,<3'

      - name: Comparator failure controls
        run: python3 tools/test_compare_motioncorr.py -v

      - name: Log toolchain & dependency telemetry
        run: |
          echo "=== Compilers & Build Tools ==="
          cmake --version
          gcc --version
          python3 --version
          xz --version
          python3 -c "import numpy; print('NumPy version:', numpy.__version__)"
          echo "=== Library Versions via pkg-config ==="
          for pkg in fftw3 fftw3f libtiff-4 libpng libjpeg zlib; do
            echo -n "$pkg: "
            pkg-config --modversion "$pkg" 2>/dev/null || echo "not reported by pkg-config"
          done

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build standalone MotionCorr
        run: |
          cmake --build build --parallel 4

      - name: "Smoke Test 1: CLI Help & Version"
        run: |
          echo "Checking CLI help via --use_own --help..."
          ./build/motioncorr --use_own --help
          echo "Checking CLI version via --use_own --version..."
          ./build/motioncorr --use_own --version

      - name: "Smoke Test 2: Automated CTest Suite"
        run: |
          python3 tools/validate_test_collection.py --test-dir build --min-count 36
          ctest --test-dir build --output-on-failure --verbose

      - name: Known-motion validation and canonical fixture preflight
        shell: bash
        run: |
          python3 tools/ci_preflight.py
          python3 test-data/generate_known_motion_fixture.py \
            --outdir "$PWD/test-data/known_motion" --canonical
          python3 tools/verify_fixtures.py \
            --fixtures-dir "$PWD/test-data/known_motion"
          python3 tools/run_known_motion_gates.py \
            --binary "$PWD/build/motioncorr" \
            --fixtures "$PWD/test-data/known_motion" \
            --outdir "$PWD/ci_known_motion" \
            --no-regenerate \
            --json "$PWD/ci_known_motion/summary.json"
          python3 tools/test_known_motion.py --binary "$PWD/build/motioncorr"
          python3 tools/test_known_motion_verdicts.py -v
          python3 tools/test_known_motion_runner.py -v
          python3 tools/test_ci_fail_closed.py -v

      - name: Canonical fixture digests are NumPy-version independent
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/numpy-old"
          "$RUNNER_TEMP/numpy-old/bin/pip" install -q 'numpy==2.2.6'
          portable="$RUNNER_TEMP/known_motion_portable"
          mkdir -p "$portable"
          cp test-data/known_motion/*.json test-data/known_motion/*.star "$portable/"
          "$RUNNER_TEMP/numpy-old/bin/python" test-data/generate_known_motion_fixture.py \
            --outdir "$portable" --canonical

      - name: "Smoke Test 3: Standalone Fixture Execution & Output Validation"
        run: |
          mkdir -p ci_smoke_out
          ./build/motioncorr \
            --i test-data/synthetic/synthetic_movie.tiff \
            --o ci_smoke_out \
            --use_own \
            --j 2 \
            --dose_weighting \
            --dose_per_frame 1.0 \
            --voltage 300 \
            --angpix 1.0 \
            --patch_x 3 \
            --patch_y 3 \
            --bfactor 150

          python3 - << 'EOF'
          import struct, sys
          from pathlib import Path

          out_dir = Path("ci_smoke_out")
          mrc_files = list(out_dir.glob("**/synthetic_movie.mrc"))
          star_files = list(out_dir.glob("**/synthetic_movie.star"))

          if not mrc_files:
              sys.exit("ERROR: Output MRC file not found in ci_smoke_out")
          if not star_files:
              sys.exit("ERROR: Output STAR file not found in ci_smoke_out")

          mrc_path = mrc_files[0]
          star_path = star_files[0]
          print(f"Discovered MRC output: {mrc_path}")
          print(f"Discovered STAR output: {star_path}")

          with open(mrc_path, "rb") as f:
              header = f.read(1024)
              nx, ny, nz, mode = struct.unpack("<4i", header[:16])
              print(f"MRC Header: nx={nx}, ny={ny}, nz={nz}, mode={mode}")
              assert (nx, ny, nz) == (512, 512, 1), f"Unexpected dimensions: {(nx, ny, nz)}"
              assert mode == 2, f"Expected float32 mode (2), got {mode}"

          with open(star_path, "r") as f:
              star_content = f.read()
              assert "data_global_shift" in star_content, "Missing data_global_shift in STAR"
              assert "_rlnMicrographShiftX" in star_content, "Missing _rlnMicrographShiftX in STAR"
              assert "_rlnMicrographShiftY" in star_content, "Missing _rlnMicrographShiftY in STAR"
              print("STAR file verification passed.")

          print("Smoke Test 3 output validation PASSED successfully.")
          EOF

          rm -rf ci_smoke_out

      - name: "Smoke Test 4: Negative Failure Handling"
        run: |
          echo "Testing missing required input (--i)..."
          if err=$(./build/motioncorr --use_own 2>&1); then
            echo "ERROR: motioncorr should have failed without --i"
            echo "Output was: $err"
            exit 1
          else
            echo "Expected failure confirmed (missing --i)."
          fi

          echo "Testing conflicting engines (--use_own and --use_motioncor2)..."
          if err=$(./build/motioncorr --i test-data/synthetic/synthetic_movie.tiff --use_own --use_motioncor2 2>&1); then
            echo "ERROR: motioncorr should have failed with conflicting engines"
            echo "Output was: $err"
            exit 1
          else
            echo "Expected failure confirmed (engine conflict)."
          fi

  cuda-compile:
    name: CUDA compile only (no GPU execution)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      # Pinned CUDA 12.8 toolchain matches the SCARF hardware validation toolchain.
      image: nvidia/cuda:12.8.0-devel-ubuntu24.04@sha256:9a8fffc32a955361aa66d754e7a0cda2513052eaf5aaf8f3ba69b80578d1c6a9
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake build-essential pkg-config libfftw3-dev libtiff-dev \
            libpng-dev libjpeg-dev zlib1g-dev python3 python3-numpy
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure CUDA
        run: |
          nvcc --version
          cmake -S . -B build-cuda -DCMAKE_BUILD_TYPE=Release \
            -DCUDA=ON -DCMAKE_CUDA_ARCHITECTURES=80 -DBUILD_TESTING=ON
      - name: Compile CUDA and linked controls
        run: cmake --build build-cuda --parallel 4
      - name: Configure with no explicit architecture
        # Regression guard for issue #18. Every other CUDA configure in this
        # repo passes -DCMAKE_CUDA_ARCHITECTURES=80, so none of them could
        # observe a fresh configure failing at the generate step, or silently
        # resolving to nvcc's own default. Asserts the exact generated flag
        # set, not the cache, which the project default deliberately shadows.
        # Both arms matter: an exported-but-empty CUDAARCHS is a second route
        # to nvcc's default. Configure only, no GPU required, and this runs
        # under the container's /bin/sh, so no bashisms.
        run: |
          set -eu
          expected='--generate-code=arch=compute_80,code=[compute_80,sm_80]'
          unset CUDAARCHS
          check_default_arch() {
            rm -rf build-cuda-default
            cmake -S . -B build-cuda-default -DCMAKE_BUILD_TYPE=Release \
              -DCUDA=ON -DBUILD_TESTING=OFF
            actual=$(grep -o -- '--generate-code=[^" ]*' \
              build-cuda-default/CMakeFiles/motioncorr_core.dir/flags.make | sort -u)
            if [ "$actual" != "$expected" ]; then
              echo "$1: expected [$expected], generated [$actual]" >&2
              exit 1
            fi
          }
          check_default_arch "CUDAARCHS unset"
          CUDAARCHS=; export CUDAARCHS
          check_default_arch "CUDAARCHS exported empty"
      - name: Record scope
        run: echo "CUDA compilation passed. This job has no GPU and provides no hardware or numerical gate result."
