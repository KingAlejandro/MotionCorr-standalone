<line x1="16" y1="430" x2="1464" y2="430" stroke="#c3c2b7" stroke-width="1"/>
<text x="16.0" y="450.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">nvcomp wins twice. It moves Deflate decode onto the GPU (+0.59 s of inflate_kernel, 24 launches — one per movie),</text>
<text x="16.0" y="466.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">and because the compressed strips go over PCIe instead of decompressed floats, H2D drops 34.2 GB → 4.6 GB (7.4x).</text>
<text x="16.0" y="482.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">Net: +0.59 s of GPU kernel buys −8.6 s of host decode and −2.4 s of transfer. CPU samples fall 93,399 → 21,685.</text>
