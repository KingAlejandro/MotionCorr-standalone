<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="867" viewBox="0 0 1180 867"><title>stages</title><rect width="1180" height="867" fill="#ffffff"/><text x="16.0" y="32.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="17" fill="#15202b" text-anchor="start" font-weight="bold">Host wall by pipeline stage, 24 movies</text><text x="16.0" y="54.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">source perf/single-gpu-pools a118699 (production tree identical to validated 054ed6d) vs base 5d0eb5c</text><text x="16.0" y="69.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">4GPUs A100-80GB GPU-eddb42fe, CUDA 12.8, nvCOMP 5.3.0.16, Release</text><text x="16.0" y="84.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">taskset 64-71, OMP_NUM_THREADS=6, THP madvise</text><text x="16.0" y="99.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">capture: nsys --trace=nvtx,osrt</text><text x="16.0" y="114.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">NVTX ranges unioned over all 24 movies. Each arm comes from its OWN --trace=nvtx,osrt capture with no CUDA trace, so</text><text x="16.0" y="129.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">CUPTI does not inflate the CUDA-heavy stages.</text><text x="16.0" y="144.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#72808d" text-anchor="start" font-weight="normal">Stages nest: an inner stage is also counted inside its parent, so the column does not sum to the process wall.</text><rect x="300" y="175" width="12" height="12" fill="#4b7bec"/><text x="318.0" y="185.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">base (main + PR130 + PR131)</text><rect x="530" y="175" width="12" height="12" fill="#20bf6b"/><text x="548.0" y="185.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11" fill="#3c4a57" text-anchor="start" font-weight="normal">final (+ gain, premask, 3 plan pools)</text><text x="288.0" y="214.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#15202b" text-anchor="end" font-weight="normal">MOVIE (executeOwnMotionCorrection)</text><rect x="300" y="199" width="616.1" height="10.0" fill="#4b7bec" rx="2"/><rect x="300" y="210.0" width="483.2" height="10.0" fill="#20bf6b" rx="2"/><text x="926.1" y="214.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#20bf6b" text-anchor="start" font-weight="normal">12.84 -&gt; 10.07 s  (-2.77)</text><text x="288.0" y="246.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#15202b" text-anchor="end" font-weight="normal">fix defect</text><rect x="300" y="231" width="84.3" height="10.0" fill="#4b7bec" rx="2"/><rect x="300" y="242.0" width="0.9" height="10.0" fill="#20bf6b" rx="2"/><text x="394.3" y="246.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#20bf6b" text-anchor="start" font-weight="normal">1.76 -&gt; 0.02 s  (-1.74)</text><text x="288.0" y="278.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#15202b" text-anchor="end" font-weight="normal">dose weighting</text><rect x="300" y="263" width="66.6" height="10.0" fill="#4b7bec" rx="2"/><rect x="300" y="274.0" width="64.6" height="10.0" fill="#20bf6b" rx="2"/><text x="376.6" y="278.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="10.5" fill="#20bf6b" text-anchor="start" font-weight="normal">1.39 -&gt; 1.35 s  (-0.04)</text><text x="288.0" y="310.0" font-family="Inter,Helvetica,Arial,sans-serif" font-size="11.5" fill="#15202b" te