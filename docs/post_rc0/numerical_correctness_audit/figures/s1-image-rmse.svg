<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Relative image RMSE for five CPU CUDA comparisons" viewBox="0 0 1120 565" width="1120" height="565"><title>Relative image RMSE for five CPU CUDA comparisons</title><desc>Five case values: 0.196182, 0.434362, 0.499014, 0.599858 and 0.807827. Lower is more agreement, not necessarily better science.</desc><rect width="1120" height="565" fill="#ffffff"/><text x="44" y="56" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#142336" font-weight="700">Production CPU vs CUDA: image disagreement</text><text x="44" y="87" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#506276" >Five S1-positive cases in PR #250 (relative RMSE, not motion truth)</text><line x1="320" y1="135" x2="320" y2="465" stroke="#e6edf2" stroke-width="1"/><text x="320" y="495" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566878" text-anchor="middle">0.0</text><line x1="465" y1="135" x2="465" y2="465" stroke="#e6edf2" stroke-width="1"/><text x="465" y="495" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566878" text-anchor="middle">0.2</text><line x1="610" y1="135" x2="610" y2="465" stroke="#e6edf2" stroke-width="1"/><text x="610" y="495" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566878" text-anchor="middle">0.4</text><line x1="755" y1="135" x2="755" y2="465" stroke="#e6edf2" stroke-width="1"/><text x="755" y="495" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566878" text-anchor="middle">0.6</text><line x1="900" y1="135" x2="900" y2="465" stroke="#e6edf2" stroke-width="1"/><text x="900" y="495" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566878" text-anchor="middle">0.8</text><line x1="1045" y1="135" x2="1045" y2="465" stroke="#e6edf2" stroke-width="1"/><text x="1045" y="495" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566878" text-anchor="middle">1.0</text><text x="302" y="182" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#213449" text-anchor="end">10216, 3 × 3</text><rect x="320" y="156" width="142.23" height="34" rx="5" fill="#337e8b"/><text x="475.23195" y="180" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#22334a" font-weight="600">0.196</text><text x="302" y="245" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#213449" text-anchor="end">10216, 5 × 5</text><rect x="320" y="219" width="314.91" height="34" rx="5" fill="#337e8b"/><text x="647.91245" y="243" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#22334a" font-weight="600">0.434</text><text x="302" y="308" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#213449" text-anchor="end">12963, 5 × 5</text><rect x="320" y="282" width="361.79" height="34" rx="5" fill="#337e8b"/><text x="694.7851499999999" y="306" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#22334a" font-weight="600">0.499</text><text x="302" y="371" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#213449" text-anchor="end">10474 Falcon 3, 5 × 5</text><rect x="320" y="345" width="434.90" height="34" rx="5" fill="#337e8b"/><text x="767.89705" y="369" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#22334a" font-weight="600">0.600</text><text x="302" y="434" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#213449" text-anchor="end">10641b, 5 × 5</text><rect x="320" y="408" width="585.67" height="34" rx="5" fill="#ad6158"/><text x="918.674575" y="432" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#22334a" font-weight="600">0.808</text><text x="682.5" y="527" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#506276" text-anchor="middle">Relative image RMSE (RMSE / CPU-reference pixel standard deviation)</text><text x="44" y="549" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#657486" >Source: PR #250 S1.3 production comparisons; five individual movie/configuration cases.</text><